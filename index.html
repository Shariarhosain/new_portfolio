    <title>Shariar Hosain — Software Engineer · Node.js · Microservices</title>
    <script>
      /* Apply viewport CSS vars before first paint to avoid hero layout jump */
      (function () {
        var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        var w = window.innerWidth;
        var root = document.documentElement;
        var mobile = w <= 820;
        root.style.setProperty('--section-h', h + 'px');
        root.style.setProperty('--nav-offset', mobile ? '3.25rem' : h <= 900 ? '4rem' : '4.75rem');
      })();
    </script>
  </head>
  <body class="locked">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
